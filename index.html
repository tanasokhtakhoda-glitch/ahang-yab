<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5c63">
<title>آهنگ‌یاب</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<style>
  :root {
    --firouzeh: #0b5c63;
    --firouzeh-deep: #083f45;
    --ring: #1d8a92;
    --ivory: #f6f1e4;
    --saffron: #f4b73f;
    --ink: #052b2f;
    --muted: #a9cfd1;
    --error: #ffb4a3;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--firouzeh);
    color: var(--ivory);
    font-family: Tahoma, "Noto Sans Arabic", system-ui, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
  }
  header {
    padding: 14px 0 0; font-size: 1.25rem; font-weight: 800;
    display: flex; align-items: center; justify-content: space-between;
  }
  .iconbtn {
    width: 46px; height: 46px; border-radius: 12px; border: 0; background: transparent;
    color: var(--ivory); cursor: pointer; display: grid; place-items: center;
  }
  .iconbtn svg { width: 28px; height: 28px; }

  main {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 22px; padding-bottom: 24px;
  }

  .stage { position: relative; width: 260px; height: 260px; display: grid; place-items: center; }
  .ring {
    position: absolute; border-radius: 50%; background: var(--ring);
    transform: scale(var(--s, 1)); opacity: var(--o, .35);
    transition: transform .12s ease-out;
  }
  .ring.r1 { width: 260px; height: 260px; opacity: calc(var(--o, .35) * .5); }
  .ring.r2 { width: 214px; height: 214px; }
  #listen {
    position: relative; width: 168px; height: 168px; border-radius: 50%;
    border: 0; background: var(--ivory); color: var(--ink); cursor: pointer;
    display: grid; place-items: center; font: inherit;
    box-shadow: 0 6px 0 var(--firouzeh-deep);
  }
  #listen:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--firouzeh-deep); }
  #listen:focus-visible, .btn:focus-visible, .iconbtn:focus-visible, input:focus-visible { outline: 3px solid var(--saffron); outline-offset: 3px; }
  #listen svg { width: 64px; height: 64px; }
  #listen .stop { display: none; }
  body.recording #listen .mic { display: none; }
  body.recording #listen .stop { display: block; }
  body.busy #listen { opacity: .6; pointer-events: none; }

  #status { min-height: 3.2em; text-align: center; font-size: 1.05rem; line-height: 1.7; max-width: 320px; }
  #status.error { color: var(--error); }

  .btn {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 14px;
    padding: 12px 18px; border: 2px solid var(--ivory); background: transparent; color: var(--ivory);
    text-decoration: none; display: inline-block; text-align: center;
  }
  .btn.solid { background: var(--saffron); border-color: var(--saffron); color: var(--ink); }
  .btn:disabled { opacity: .5; }

  #filebox { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 320px; }
  #fileopts { display: none; flex-direction: column; gap: 10px; width: 100%; }
  #fileopts.show { display: flex; }
  #fname { font-size: .9rem; color: var(--muted); overflow-wrap: anywhere; text-align: center; }
  .row { display: flex; align-items: center; gap: 10px; justify-content: center; }
  input[type=number] {
    width: 84px; font: inherit; padding: 8px; border-radius: 10px; border: 2px solid var(--ivory);
    background: var(--firouzeh-deep); color: var(--ivory); text-align: center;
  }

  #result {
    display: none; width: 100%; max-width: 320px; background: var(--ivory); color: var(--ink);
    border-radius: 18px; padding: 16px; gap: 12px; flex-direction: column;
  }
  #result.show { display: flex; }
  .top { display: flex; gap: 14px; align-items: center; }
  #cover { width: 84px; height: 84px; border-radius: 12px; object-fit: cover; background: #d8d1bd; flex: none; }
  #cover[hidden] { display: none; }
  #title { font-weight: 800; font-size: 1.2rem; line-height: 1.5; overflow-wrap: anywhere; }
  #artist { color: #36565a; overflow-wrap: anywhere; }
  .links { display: flex; gap: 10px; }
  .links .btn { flex: 1; border-color: var(--ink); color: var(--ink); padding: 10px 8px; }
  .links .btn.solid { background: var(--saffron); border-color: var(--saffron); }
  #copy { border-color: var(--ink); color: var(--ink); padding: 10px 8px; width: 100%; }

  /* پنجره‌ی تاریخچه */
  #hist {
    position: fixed; inset: 0; z-index: 10; background: var(--firouzeh);
    display: none; flex-direction: column; overflow-y: auto;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
  }
  #hist.show { display: flex; }
  .hhead { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 12px; font-size: 1.25rem; font-weight: 800; }
  #hlist { display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px; }
  #hempty { text-align: center; color: var(--muted); padding: 40px 0; line-height: 1.8; }
  .item { background: var(--ivory); color: var(--ink); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .item .info { display: flex; gap: 12px; align-items: center; }
  .item img { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; flex: none; background: #d8d1bd; }
  .item .t { font-weight: 800; overflow-wrap: anywhere; }
  .item .a { color: #36565a; overflow-wrap: anywhere; font-size: .95rem; }
  .item .d { color: #5b7a7e; font-size: .8rem; }
  .item .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .item .btn { flex: 1 1 calc(50% - 4px); padding: 8px 6px; font-size: .9rem; border-color: var(--ink); color: var(--ink); }
  .item .btn.del { border-color: #a0443a; color: #a0443a; }
  #hclear { margin: 0 auto 24px; }

  @media (prefers-reduced-motion: reduce) { .ring { transition: none; } }
</style>
</head>
<body>
<header>
  <span>آهنگ‌یاب</span>
  <button class="iconbtn" id="menuBtn" aria-label="تاریخچه‌ی آهنگ‌ها">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M4 7h16M4 12h16M4 17h16"></path>
    </svg>
  </button>
</header>

<main>
  <div class="stage">
    <div class="ring r1" id="r1"></div>
    <div class="ring r2" id="r2"></div>
    <button id="listen" aria-label="گوش دادن به آهنگ">
      <svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="3" width="6" height="11" rx="3"></rect>
        <path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path>
      </svg>
      <svg class="stop" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
    </button>
  </div>

  <div id="status" role="status" aria-live="polite">برای شناسایی آهنگ، دکمه را بزنید</div>

  <div id="result" aria-live="polite">
    <div class="top">
      <img id="cover" alt="" hidden>
      <div>
        <div id="title"></div>
        <div id="artist"></div>
      </div>
    </div>
    <div class="links">
      <a class="btn solid" id="yt" target="_blank" rel="noopener">جستجو در یوتیوب</a>
      <a class="btn" id="sp" target="_blank" rel="noopener">جستجو در اسپاتیفای</a>
    </div>
    <button class="btn" id="copy" type="button">کپی نام خواننده و آهنگ</button>
  </div>

  <div id="filebox">
    <button class="btn" id="pick" type="button">انتخاب فایل صوتی یا ویدیو</button>
    <input type="file" id="file" accept="audio/*,video/*" hidden>
    <div id="fileopts">
      <div id="fname"></div>
      <div class="row">
        <label for="start">شروع از ثانیه</label>
        <input type="number" id="start" min="0" step="1" value="0" inputmode="numeric">
      </div>
      <button class="btn solid" id="go" type="button">شناسایی این فایل</button>
    </div>
  </div>
</main>

<section id="hist" aria-label="تاریخچه">
  <div class="hhead">
    <span>تاریخچه‌ی آهنگ‌ها</span>
    <button class="iconbtn" id="hclose" aria-label="بستن">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18"></path>
      </svg>
    </button>
  </div>
  <div id="hempty">هنوز آهنگی پیدا نشده است.</div>
  <div id="hlist"></div>
  <button class="btn" id="hclear" type="button">پاک کردن همه‌ی تاریخچه</button>
</section>

<script>
const $ = (id) => document.getElementById(id);
const RECORD_SECONDS = 12;          // مدت ضبط با میکروفون
const CLIP_SECONDS = 15;            // مقداری که از فایل بریده می‌شود
const AUDIO_BITRATE = 32000;        // کیفیت ضبط (۳۲ کیلوبیت؛ برای شناسایی کافی است)
const STALL_MS = 12000;             // اگر ارسال این مدت جلو نرفت، قطع و دوباره تلاش می‌شود
const RESPONSE_TIMEOUT_MS = 120000; // حداکثر انتظار کل برای یک تلاش
const MAX_TRIES = 3;                // تعداد تلاش برای ارسال
const SERVER_LIMIT = 30 * 1024 * 1024;
const MAX_LOCAL_FILE = 80 * 1024 * 1024;
const HIST_KEY = 'ahang-yab-history';
let recorder, stream, audioCtx, rafId, timerId, chunks = [], chosenFile = null, current = null;

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
fetch('/health').catch(() => {});

const fa = (n) => Number(n).toLocaleString('fa-IR');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* ---------- کپی کردن نام خواننده و آهنگ ---------- */
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  return ok;
}
async function copyText(text, btn) {
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    ok = fallbackCopy(text);
  }
  if (!btn.dataset.label) btn.dataset.label = btn.textContent;
  btn.textContent = ok ? 'کپی شد' : 'کپی نشد';
  setTimeout(() => { btn.textContent = btn.dataset.label; }, 1500);
}
function songLabel(artist, title) {
  return [artist, title].filter(Boolean).join(' - ');
}
$('copy').addEventListener('click', () => {
  if (current) copyText(songLabel(current.artist, current.title), $('copy'));
});

/* ---------- تاریخچه (روی همین گوشی ذخیره می‌شود) ---------- */
function loadHist() {
  try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch (e) { return []; }
}
function saveHist(list) {
  try { localStorage.setItem(HIST_KEY, JSON.stringify(list.slice(0, 200))); } catch (e) {}
}
function addHist(d) {
  const list = loadHist();
  if (list[0] && list[0].title === d.title && list[0].artist === d.artist) {
    list[0].t = Date.now();
  } else {
    list.unshift({
      title: d.title || '', artist: d.artist || '', cover: d.cover || '',
      youtube: d.youtube || '', spotify: d.spotify || '', t: Date.now(),
    });
  }
  saveHist(list);
}
function fmtDate(ts) {
  try {
    const dt = new Date(ts);
    return dt.toLocaleDateString('fa-IR') + ' - ' + dt.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
  } catch (e) { return ''; }
}
function renderHist() {
  const list = loadHist();
  const box = $('hlist');
  box.textContent = '';
  $('hempty').style.display = list.length ? 'none' : 'block';
  $('hclear').style.display = list.length ? 'block' : 'none';
  list.forEach((it, i) => {
    const el = document.createElement('div');
    el.className = 'item';

    const info = document.createElement('div');
    info.className = 'info';
    if (it.cover) {
      const img = document.createElement('img');
      img.src = it.cover; img.alt = '';
      info.appendChild(img);
    }
    const txt = document.createElement('div');
    const t = document.createElement('div'); t.className = 't'; t.textContent = it.title;
    const a = document.createElement('div'); a.className = 'a'; a.textContent = it.artist;
    const d = document.createElement('div'); d.className = 'd'; d.textContent = fmtDate(it.t);
    txt.append(t, a, d);
    info.appendChild(txt);

    const acts = document.createElement('div');
    acts.className = 'acts';
    const yt = document.createElement('a');
    yt.className = 'btn'; yt.textContent = 'یوتیوب'; yt.href = it.youtube; yt.target = '_blank'; yt.rel = 'noopener';
    const sp = document.createElement('a');
    sp.className = 'btn'; sp.textContent = 'اسپاتیفای'; sp.href = it.spotify; sp.target = '_blank'; sp.rel = 'noopener';
    const cp = document.createElement('button');
    cp.className = 'btn'; cp.type = 'button'; cp.textContent = 'کپی';
    cp.addEventListener('click', () => copyText(songLabel(it.artist, it.title), cp));
    const del = document.createElement('button');
    del.className = 'btn del'; del.type = 'button'; del.textContent = 'حذف';
    del.addEventListener('click', () => {
      const cur = loadHist();
      cur.splice(i, 1);
      saveHist(cur);
      renderHist();
    });
    acts.append(yt, sp, cp, del);

    el.append(info, acts);
    box.appendChild(el);
  });
}
$('menuBtn').addEventListener('click', () => { renderHist(); $('hist').classList.add('show'); });
$('hclose').addEventListener('click', () => $('hist').classList.remove('show'));
$('hclear').addEventListener('click', () => {
  if (confirm('همه‌ی تاریخچه پاک شود؟')) { saveHist([]); renderHist(); }
});

/* ---------- نمایش وضعیت ---------- */
function setStatus(text, isError = false) {
  const s = $('status');
  s.textContent = text;
  s.classList.toggle('error', isError);
}

function setLevel(v) {
  $('r2').style.setProperty('--s', 1 + v * 0.22);
  $('r2').style.setProperty('--o', 0.35 + v * 0.4);
  $('r1').style.setProperty('--s', 1 + v * 0.1);
  $('r1').style.setProperty('--o', 0.35 + v * 0.4);
}

function resetResult() {
  current = null;
  $('result').classList.remove('show');
}

function showResult(d) {
  current = d;
  $('title').textContent = d.title || '';
  $('artist').textContent = d.artist || '';
  const cover = $('cover');
  if (d.cover) { cover.src = d.cover; cover.hidden = false; } else { cover.hidden = true; }
  $('yt').href = d.youtube;
  $('sp').href = d.spotify;
  $('result').classList.add('show');
  setStatus('پیدا شد');
  addHist(d);
}

/* ---------- ساخت ضبط‌کننده‌ی کم‌حجم ---------- */
function makeRecorder(mediaStream) {
  const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
  const mimeType = window.MediaRecorder && types.find((t) => MediaRecorder.isTypeSupported(t));
  const opts = { audioBitsPerSecond: AUDIO_BITRATE };
  if (mimeType) opts.mimeType = mimeType;
  return new MediaRecorder(mediaStream, opts);
}
function extFor(type) {
  return type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm';
}

/* ---------- بریدن و کم‌حجم کردن فایل داخل خود گوشی ---------- */
async function compressFile(file, startSec, onTick) {
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  try {
    const audio = await ctx.decodeAudioData(await file.arrayBuffer());
    if (startSec >= audio.duration - 1) throw new Error('short');
    const dur = Math.min(CLIP_SECONDS, audio.duration - startSec);
    if (ctx.state === 'suspended') await ctx.resume();

    const dest = ctx.createMediaStreamDestination();
    try { dest.channelCount = 1; } catch (e) {}
    const src = ctx.createBufferSource();
    src.buffer = audio;
    src.connect(dest);

    const rec = makeRecorder(dest.stream);
    const parts = [];
    rec.ondataavailable = (e) => e.data.size && parts.push(e.data);
    const stopped = new Promise((res) => { rec.onstop = res; });

    rec.start();
    src.start(0, startSec, dur);
    let left = Math.ceil(dur);
    const iv = setInterval(() => { left -= 1; if (left > 0) onTick(left); }, 1000);
    src.onended = () => { if (rec.state !== 'inactive') rec.stop(); };
    await stopped;
    clearInterval(iv);

    const type = rec.mimeType || 'audio/webm';
    return { blob: new Blob(parts, { type }), name: 'clip.' + extFor(type) };
  } finally {
    ctx.close();
  }
}

/* ---------- ارسال به سرور (با تشخیص گیر کردن و تلاش دوباره) ---------- */
function uploadOnce(blob, filename, startSec, onPhase) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/recognize');
    xhr.timeout = RESPONSE_TIMEOUT_MS;
    let lastProgress = Date.now();
    let uploading = true;
    const watch = setInterval(() => {
      if (uploading && Date.now() - lastProgress > STALL_MS) {
        clearInterval(watch);
        xhr.abort();
        reject(new Error('stall'));
      }
    }, 1000);
    xhr.upload.onprogress = (e) => {
      lastProgress = Date.now();
      if (e.lengthComputable) onPhase('upload', Math.round((e.loaded / e.total) * 100));
    };
    xhr.upload.onload = () => {
      uploading = false;
      lastProgress = Date.now();
      onPhase('wait', 100);
    };
    xhr.onload = () => {
      clearInterval(watch);
      let data = null;
      try { data = JSON.parse(xhr.responseText); } catch (e) {}
      resolve({ status: xhr.status, data });
    };
    xhr.onerror = () => { clearInterval(watch); reject(new Error('network')); };
    xhr.ontimeout = () => { clearInterval(watch); reject(new Error('timeout')); };
    const fd = new FormData();
    fd.append('file', blob, filename);
    fd.append('start', String(startSec || 0));
    xhr.send(fd);
  });
}

async function send(blob, filename, startSec) {
  document.body.classList.add('busy');
  resetResult();
  let phase = 'upload';
  let wakeTimer = null;
  const onPhase = (p, pct) => {
    phase = p;
    if (p === 'upload') {
      setStatus('در حال ارسال… ' + fa(pct) + '٪');
    } else if (p === 'wait') {
      setStatus('ارسال شد؛ در حال شناسایی…');
      clearTimeout(wakeTimer);
      wakeTimer = setTimeout(() => {
        if (phase === 'wait') setStatus('سرور رایگان تازه بیدار می‌شود؛ تا یک دقیقه صبر کنید…');
      }, 9000);
    }
  };

  try {
    let res = null;
    for (let attempt = 1; attempt <= MAX_TRIES; attempt++) {
      try {
        setStatus(attempt === 1 ? 'در حال ارسال…' : `تلاش دوباره (${fa(attempt)} از ${fa(MAX_TRIES)})…`);
        res = await uploadOnce(blob, filename, startSec, onPhase);
        break;
      } catch (e) {
        const retryable = e.message === 'stall' || e.message === 'network';
        if (retryable && attempt < MAX_TRIES) {
          setStatus(`ارسال قطع شد؛ تلاش دوباره (${fa(attempt + 1)} از ${fa(MAX_TRIES)})…`);
          await sleep(1500);
          continue;
        }
        throw e;
      }
    }

    const { status, data } = res;
    if (status === 413) setStatus('فایل بیشتر از ۳۰ مگابایت است. فایل کوچک‌تری انتخاب کنید.', true);
    else if (status === 422) setStatus('این فایل صدا ندارد یا خوانده نشد. فایل دیگری امتحان کنید.', true);
    else if (status === 504) setStatus('شناسایی بیش از حد طول کشید. کمی بعد دوباره امتحان کنید.', true);
    else if (status !== 200 || !data) setStatus('خطای سرور. چند لحظه بعد دوباره امتحان کنید.', true);
    else if (data.found) showResult(data);
    else setStatus('آهنگ پیدا نشد. نزدیک‌تر به منبع صدا ضبط کنید یا از بخش دیگری از آهنگ شروع کنید.', true);
  } catch (e) {
    if (e.message === 'timeout') {
      setStatus('پاسخی نیامد. چند لحظه بعد دوباره امتحان کنید.', true);
    } else {
      setStatus('ارسال کامل نشد؛ اتصال شما به سرور مشکل دارد. فیلترشکن را امتحان کنید.', true);
    }
  } finally {
    clearTimeout(wakeTimer);
    document.body.classList.remove('busy');
  }
}

/* ---------- شناسایی از روی فایل ---------- */
async function recognizeFile(file, startSec) {
  document.body.classList.add('busy');
  resetResult();
  if (file.size > MAX_LOCAL_FILE) {
    setStatus('این فایل خیلی بزرگ است. فایل کوچک‌تری انتخاب کنید.', true);
    document.body.classList.remove('busy');
    return;
  }
  setStatus('در حال آماده‌سازی فایل… (حدود ۱۵ ثانیه)');
  let blob = file, name = file.name, start = startSec;
  try {
    const out = await compressFile(file, startSec, (left) => {
      setStatus(`در حال آماده‌سازی فایل… ${fa(left)}`);
    });
    blob = out.blob;
    name = out.name;
    start = 0;
  } catch (e) {
    if (e && e.message === 'short') {
      setStatus('ثانیه‌ی شروع از طول فایل بیشتر است. عدد کوچک‌تری بگذارید.', true);
      document.body.classList.remove('busy');
      return;
    }
    if (file.size > SERVER_LIMIT) {
      setStatus('این فایل در گوشی خوانده نشد و برای ارسال مستقیم هم بزرگ است.', true);
      document.body.classList.remove('busy');
      return;
    }
    // اگر آماده‌سازی شکست خورد، فایل اصلی (کوچک) را می‌فرستیم
  }
  await send(blob, name, start);
}

/* ---------- ضبط با میکروفون ---------- */
async function startRecording() {
  resetResult();
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    });
  } catch (e) {
    setStatus('اجازه‌ی میکروفون داده نشد. در تنظیمات مرورگر دسترسی میکروفون را فعال کنید.', true);
    return;
  }
  chunks = [];
  recorder = makeRecorder(stream);
  recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    cancelAnimationFrame(rafId);
    clearInterval(timerId);
    setLevel(0);
    stream.getTracks().forEach((t) => t.stop());
    if (audioCtx) audioCtx.close();
    document.body.classList.remove('recording');
    const type = recorder.mimeType || 'audio/webm';
    send(new Blob(chunks, { type }), 'rec.' + extFor(type), 0);
  };

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const analyser = audioCtx.createAnalyser();
  analyser.fftSize = 512;
  audioCtx.createMediaStreamSource(stream).connect(analyser);
  const buf = new Uint8Array(analyser.fftSize);
  const tick = () => {
    analyser.getByteTimeDomainData(buf);
    let peak = 0;
    for (const b of buf) peak = Math.max(peak, Math.abs(b - 128));
    setLevel(Math.min(peak / 60, 1));
    rafId = requestAnimationFrame(tick);
  };
  tick();

  recorder.start();
  document.body.classList.add('recording');
  let left = RECORD_SECONDS;
  setStatus(`در حال گوش دادن… ${fa(left)}`);
  timerId = setInterval(() => {
    left -= 1;
    if (left <= 0) { stopRecording(); return; }
    setStatus(`در حال گوش دادن… ${fa(left)}`);
  }, 1000);
}

function stopRecording() {
  if (recorder && recorder.state !== 'inactive') recorder.stop();
}

$('listen').addEventListener('click', () => {
  if (document.body.classList.contains('recording')) stopRecording();
  else startRecording();
});

$('pick').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', () => {
  chosenFile = $('file').files[0] || null;
  if (!chosenFile) return;
  $('fname').textContent = chosenFile.name;
  $('fileopts').classList.add('show');
  resetResult();
  setStatus('فایل انتخاب شد. اگر آهنگ از ابتدای فایل شروع نمی‌شود، ثانیه‌ی شروع را تغییر دهید.');
});
$('go').addEventListener('click', () => {
  if (chosenFile) recognizeFile(chosenFile, parseFloat($('start').value) || 0);
});
</script>
